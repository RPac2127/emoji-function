<main></main>
<script src="https://cdn.jsdelivr.net/gh/netizenorg/
netnet-standard-library@1.0.1/build/nn.min.js">
</script>
<script>
  
  function emoji(){
    if (!nn.mouseDown) return
    let x = nn.mouseX
    let y = nn.mouseY
    nn.create('h1')
      .content('pluh')
      .addTo('main')
      .position(x, y)
      .css('user-select', 'none')
  }
  
  
  function emoji_specific  (x, y, z) {

    nn.create('h1')
      .content(z)
      .addTo('main')
      .positionOrigin('center')
      .position(x, y)
  }
  
  nn.on('mousemove', emoji)
  
  


  
  
</script>
